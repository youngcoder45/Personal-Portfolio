version: 2
updates:
  # Configuration for npm package updates
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    # Limit the number of open pull requests to 7
    open-pull-requests-limit: 7
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
